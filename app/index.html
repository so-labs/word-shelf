<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F3A5F" />
    <meta
      name="description"
      content="IMEのユーザー辞書を、正本ファイル（DictionaryMaster.tsv）で管理するツールです。"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Word Shelf" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Word Shelf</title>
    <script>
      // 初期表示でテーマがちらつかないよう、描画前に保存済みテーマを適用します。
      try {
        var pref = localStorage.getItem("word-shelf:theme") || "system";
        var dark =
          pref === "dark" ||
          (pref === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        // ステータスバーの色も、解決したテーマに合わせておきます。
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute("content", dark ? "#0D141D" : "#1F3A5F");
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
